[project]
name = "pulsartrace-ai"
version = "0.1.0"
description = "PulsarTrace diarization layer — pyannote / diart wrapper run as a captive subprocess by the Swift engine."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Real dependencies (pyannote.audio, diart, torch, numpy, scipy) are pinned in
# requirements.lock and installed in Epic 3. Epic 1 ships only the package
# skeleton, the venv build script, and the pytest harness.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulsartrace_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
