[project]
name = "pulsartrace-ai"
version = "0.1.0"
description = "PulsarTrace diarization layer — pyannote / diart wrapper run as a captive subprocess by the Swift engine."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Runtime dependencies. Exact versions (the full transitive closure) are
# pinned in requirements.lock — the source of truth installed by
# python/build-venv.sh. These ranges document the direct deps only; the lock
# governs what is actually installed. diart (live diarization) is added in
# Epic 6; Epic 3 is offline-only.
dependencies = [
    "pyannote.audio>=4.0,<5.0",
    "torch>=2.8",
    "torchaudio>=2.8",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulsartrace_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
