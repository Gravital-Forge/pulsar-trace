# PulsarTrace AI layer — pinned dependency lock.
#
# Source of truth installed by `python/build-venv.sh`. Per the determinism
# rule (PRD §12) every dependency is pinned by exact version: this is the full
# transitive closure as resolved on the build host (macOS arm64, Python
# 3.12.13) — see DECISIONS.md D9.
#
# Epic 3 (Offline Diarization) introduces the real diarization stack:
# pyannote.audio 4.0.4 (the speaker-diarization-community-1 model), torch 2.12
# / torchaudio 2.11 (the macOS arm64 wheels ship the MPS backend by default),
# numpy and scipy. `pytest` is the dev/test runner.
#
# diart is intentionally NOT in this lock. Epic 6's live diarization uses
# windowed-pyannote, not diart (DECISIONS.md D19): `pip install diart` resolves
# pyannote.audio DOWN to 3.4.0, which would break the Epic 3 offline pipeline
# (it needs the pyannote 4.x `speaker-diarization-community-1` model) and the
# cross-comparability of speaker-library centroids (R29). The live pass runs
# the same pinned pyannote 4.0.4 pipeline on a sliding audio window instead, so
# no new dependency is needed and diart is intentionally absent.
#
# TELEMETRY NOTE (Hard Invariant #1 / DECISIONS.md D12): pyannote.audio 4.0.4
# ships default-on OpenTelemetry metrics that POST to https://otel.pyannote.ai
# (hence the opentelemetry-* pins below — transitive deps of pyannote.audio,
# NOT used by PulsarTrace). `pulsartrace_ai/diarize.py` disables this before
# importing pyannote (`PYANNOTE_METRICS_ENABLED=false` + `set_telemetry_metrics
# (False)`); the Swift Diarizer also injects the env var into the subprocess.
# Do not remove the disable code when bumping pyannote — re-verify telemetry
# stays off.
#
# Regenerate with:
#   python/build-venv.sh
#   python/pulsartrace-ai/.venv/bin/pip freeze | grep -v '^-e ' \
#     | grep -v pulsartrace >> requirements.lock   # then re-add this header
